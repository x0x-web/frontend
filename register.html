<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Create your DFDV account — Join the AI-powered deepfake detection platform.">
    <title>Register — DFDV</title>
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/login&register.css">
</head>
<body>
<div class="page-wrapper">
    <header>
        <div class="header-inner">
            <a href="index.html" class="logo" id="logo-link">
                <div class="logo-icon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="23 7 16 12 23 17 23 7"></polygon>
                        <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
                    </svg>
                </div>
                <span class="logo-text">DFDV</span>
            </a>
            <div class="nav-actions">
                <a href="login.html" class="btn btn-primary" id="nav-login">Login</a>
            </div>
        </div>
    </header>

    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                        <circle cx="8.5" cy="7" r="4"/>
                        <line x1="20" y1="8" x2="20" y2="14"/>
                        <line x1="23" y1="11" x2="17" y2="11"/>
                    </svg>
                </div>
                <h2>Create Account</h2>
                <p>Get started with deepfake detection</p>
            </div>
            <form id="registerForm">
                <div class="form-group">
                    <label for="regName">Full Name</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                        <input type="text" id="regName" placeholder="John Doe" required autocomplete="name" />
                    </div>
                </div>
                <div class="form-group">
                    <label for="regEmail">Email Address</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                        <input type="email" id="regEmail" placeholder="you@example.com" required autocomplete="email" />
                    </div>
                </div>
                <div class="form-group">
                    <label for="regPassword">Password</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                        <input type="password" id="regPassword" placeholder="Create a strong password" required autocomplete="new-password" />
                    </div>
                    <!-- Password strength rules -->
                    <div class="password-rules" id="passwordRules">
                        <div class="strength-meter">
                            <div class="strength-bar-track">
                                <div class="strength-bar-fill" id="strengthBar"></div>
                            </div>
                            <span class="strength-label" id="strengthLabel">—</span>
                        </div>
                        <div class="rule-item" id="rule-length">
                            <div class="rule-icon">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                            </div>
                            <span class="rule-text">At least 8 characters</span>
                        </div>
                        <div class="rule-item" id="rule-upper">
                            <div class="rule-icon">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                            </div>
                            <span class="rule-text">One uppercase letter (A–Z)</span>
                        </div>
                        <div class="rule-item" id="rule-lower">
                            <div class="rule-icon">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                            </div>
                            <span class="rule-text">One lowercase letter (a–z)</span>
                        </div>
                        <div class="rule-item" id="rule-number">
                            <div class="rule-icon">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                            </div>
                            <span class="rule-text">One number (0–9)</span>
                        </div>
                        <div class="rule-item" id="rule-symbol">
                            <div class="rule-icon">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                            </div>
                            <span class="rule-text">One special character (!@#$…)</span>
                        </div>
                    </div>
                </div>
                <button type="submit" class="auth-submit" id="registerBtn" disabled>
                    <span class="spinner"></span>
                    <span class="btn-text">Create Account</span>
                </button>
            </form>
            <div class="auth-footer">Already have an account? <a href="login.html">Sign in</a></div>
        </div>
    </div>

    <footer class="footer"><p>DFDV © 2026 — AI-Powered DeepFake Detection</p></footer>
</div>
<div class="toast-container" id="toastContainer"></div>
<script>
const baseURL = "http://localhost:4000";
function showToast(msg, type="info") {
    const c = document.getElementById("toastContainer");
    const icons = {
        success:'<svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>',
        error:'<svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>',
        info:'<svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>'
    };
    const t = document.createElement("div");
    t.className = `toast toast-${type}`;
    t.innerHTML = `${icons[type]||icons.info}<span>${msg}</span><button class="toast-close" aria-label="Close"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>`;
    c.appendChild(t);
    const cl = () => { t.classList.add("toast-exit"); setTimeout(() => t.remove(), 300); };
    t.querySelector(".toast-close").addEventListener("click", cl);
    setTimeout(cl, 4500);
}

// ── Password Strength Checker ──
const pwInput = document.getElementById("regPassword");
const rulesBox = document.getElementById("passwordRules");
const strengthBar = document.getElementById("strengthBar");
const strengthLabel = document.getElementById("strengthLabel");
const registerBtn = document.getElementById("registerBtn");

const rules = {
    length: { el: document.getElementById("rule-length"), test: pw => pw.length >= 8 },
    upper:  { el: document.getElementById("rule-upper"),  test: pw => /[A-Z]/.test(pw) },
    lower:  { el: document.getElementById("rule-lower"),  test: pw => /[a-z]/.test(pw) },
    number: { el: document.getElementById("rule-number"), test: pw => /[0-9]/.test(pw) },
    symbol: { el: document.getElementById("rule-symbol"), test: pw => /[^A-Za-z0-9]/.test(pw) },
};

// Show rules when password field is focused or has value
pwInput.addEventListener("focus", () => rulesBox.classList.add("visible"));
pwInput.addEventListener("blur", () => {
    if (!pwInput.value) rulesBox.classList.remove("visible");
});

function checkPassword() {
    const pw = pwInput.value;
    let passed = 0;
    const total = Object.keys(rules).length;

    for (const key in rules) {
        const ok = rules[key].test(pw);
        rules[key].el.classList.toggle("passed", ok);
        if (ok) passed++;
    }

    // Update strength bar
    const pct = (passed / total) * 100;
    strengthBar.style.width = pct + "%";

    if (passed === 0) {
        strengthBar.style.background = "var(--text-muted)";
        strengthLabel.textContent = "—";
        strengthLabel.style.color = "var(--text-muted)";
    } else if (passed <= 2) {
        strengthBar.style.background = "var(--danger)";
        strengthLabel.textContent = "Weak";
        strengthLabel.style.color = "var(--danger)";
    } else if (passed <= 4) {
        strengthBar.style.background = "var(--warning)";
        strengthLabel.textContent = "Fair";
        strengthLabel.style.color = "var(--warning)";
    } else {
        strengthBar.style.background = "var(--success)";
        strengthLabel.textContent = "Strong";
        strengthLabel.style.color = "var(--success)";
    }

    // Enable/disable submit based on all rules passing
    const allPassed = passed === total;
    registerBtn.disabled = !allPassed;
    return allPassed;
}

pwInput.addEventListener("input", checkPassword);

// ── Form Submit ──
document.getElementById("registerForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    if (!checkPassword()) {
        showToast("Please meet all password requirements", "error");
        return;
    }
    const btn = registerBtn;
    btn.classList.add("loading"); btn.disabled = true;
    try {
        const body = {
            name: document.getElementById("regName").value,
            email: document.getElementById("regEmail").value,
            password: pwInput.value
        };
        const res = await fetch(`${baseURL}/user/register`, { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body) });
        const data = await res.json();
        if (res.ok) {
            showToast("Account created successfully! Redirecting to login…", "success");
            setTimeout(() => { window.location.href = "login.html"; }, 1500);
        } else { showToast(data.message || "Registration failed. Please try again.", "error"); }
    } catch(err) { showToast("Connection error. Please try again.", "error"); }
    finally { btn.classList.remove("loading"); btn.disabled = false; }
});
</script>
</body>
</html>
