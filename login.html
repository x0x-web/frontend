<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Login to DFDV — Access the AI-powered deepfake video detection platform.">
    <title>Login — DFDV</title>
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/login&register.css">
</head>
<body>
<div class="page-wrapper">
    <header>
        <div class="header-inner">
            <a href="index.html" class="logo" id="logo-link">
                <div class="logo-icon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="23 7 16 12 23 17 23 7"></polygon>
                        <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
                    </svg>
                </div>
                <span class="logo-text">DFDV</span>
            </a>
            <div class="nav-actions">
                <a href="register.html" class="btn btn-primary" id="nav-register">Register</a>
            </div>
        </div>
    </header>

    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
                        <polyline points="10 17 15 12 10 7"/>
                        <line x1="15" y1="12" x2="3" y2="12"/>
                    </svg>
                </div>
                <h2>Welcome back</h2>
                <p>Sign in to your account to continue</p>
            </div>
            <form id="loginForm">
                <div class="form-group">
                    <label for="logEmail">Email Address</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                        <input type="email" id="logEmail" placeholder="you@example.com" required autocomplete="email" />
                    </div>
                </div>
                <div class="form-group">
                    <label for="logPassword">Password</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                        <input type="password" id="logPassword" placeholder="Enter your password" required autocomplete="current-password" />
                    </div>
                </div>
                <button type="submit" class="auth-submit" id="loginBtn">
                    <span class="spinner"></span>
                    <span class="btn-text">Sign In</span>
                </button>
            </form>
            <div class="auth-footer">Don't have an account? <a href="register.html">Create one</a></div>
        </div>
    </div>

    <footer class="footer"><p>DFDV © 2026 — AI-Powered DeepFake Detection</p></footer>
</div>
<div class="toast-container" id="toastContainer"></div>
<script>
const baseURL = "http://localhost:4000";
function showToast(msg, type="info") {
    const c = document.getElementById("toastContainer");
    const icons = {
        success:'<svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>',
        error:'<svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>',
        info:'<svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>'
    };
    const t = document.createElement("div");
    t.className = `toast toast-${type}`;
    t.innerHTML = `${icons[type]||icons.info}<span>${msg}</span><button class="toast-close" aria-label="Close"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>`;
    c.appendChild(t);
    const cl = () => { t.classList.add("toast-exit"); setTimeout(() => t.remove(), 300); };
    t.querySelector(".toast-close").addEventListener("click", cl);
    setTimeout(cl, 4500);
}
document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = document.getElementById("loginBtn");
    btn.classList.add("loading"); btn.disabled = true;
    try {
        const body = { email: document.getElementById("logEmail").value, password: document.getElementById("logPassword").value };
        const res = await fetch(`${baseURL}/user/login`, { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body) });
        const data = await res.json();
        if (data.token) {
            window.localStorage.setItem("token", data.token);
            // Cache user data for instant UI on other pages
            if (data.user) {
                window.localStorage.setItem("userData", JSON.stringify(data.user));
            }
            showToast("Login successful! Redirecting…", "success");
            setTimeout(() => { window.location.href = "index.html"; }, 1200);
        } else { showToast(data.message || "Invalid email or password", "error"); }
    } catch(err) { showToast("Connection error. Please try again.", "error"); }
    finally { btn.classList.remove("loading"); btn.disabled = false; }
});
</script>
</body>
</html>
